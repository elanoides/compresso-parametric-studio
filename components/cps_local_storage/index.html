<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>cps-local-storage</title>
    <script>
      /**
       * Minimal Streamlit component bridge for browser localStorage.
       * Temporary helper for Compresso presets persistence — keep with the app.
       */
      function post(type, payload) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, payload || {}),
          "*"
        );
      }

      function setReady() {
        post("streamlit:componentReady", { apiVersion: 1 });
        post("streamlit:setFrameHeight", { height: 0 });
      }

      function setValue(value) {
        post("streamlit:setComponentValue", { value: value });
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.type !== "streamlit:render") {
          return;
        }
        var args = data.args || {};
        var key = args.storage_key || "compresso_presets_v1";
        var mode = args.mode || "load";

        try {
          if (mode === "save") {
            var payload = args.payload;
            if (payload === null || payload === undefined || payload === "") {
              localStorage.removeItem(key);
            } else {
              localStorage.setItem(key, String(payload));
            }
            setValue({ ok: true, mode: "save", key: key });
          } else {
            var raw = localStorage.getItem(key);
            setValue({
              ok: true,
              mode: "load",
              key: key,
              payload: raw === null ? "" : raw,
            });
          }
        } catch (err) {
          setValue({
            ok: false,
            mode: mode,
            key: key,
            error: String(err),
            payload: "",
          });
        }
      });

      setReady();
    </script>
  </head>
  <body></body>
</html>
